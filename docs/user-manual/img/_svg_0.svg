<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">
      <defs>
        <style>
          .r{fill:#eef3f9;stroke:#9fb2c9;stroke-width:1.2}
          .r2{fill:#dde8f5;stroke:#9fb2c9;stroke-width:1.2}
          .t{fill:#24344c;font-size:12px}
          .tt{fill:#5b6b7e;font-size:11px}
        </style>
      </defs>
      <rect x="2" y="2" width="756" height="460" fill="#ffffff" stroke="#cdd8e6"/>
      <!-- menubar -->
      <rect class="r2" x="2" y="2" width="756" height="26"/>
      <text class="t" x="14" y="19">菜单栏：文件 编辑 视图 绘制 标注 修改 扩展工具(&amp;R) 帮助</text>
      <!-- toolbar -->
      <rect class="r" x="2" y="28" width="756" height="34"/>
      <text class="tt" x="14" y="49">工具栏（可显隐）：新建 打开 保存 | 直线 圆 弧 多段线 | 标注 公差 | 主题切换</text>
      <!-- left panel: layers -->
      <rect class="r" x="2" y="62" width="170" height="320"/>
      <text class="t" x="14" y="80">图层面板</text>
      <text class="tt" x="14" y="100">☑ 0 默认</text>
      <text class="tt" x="14" y="118">☑ 中心线</text>
      <text class="tt" x="14" y="136">☑ 标注</text>
      <text class="tt" x="14" y="154">☑ 标题栏</text>
      <!-- drawing area -->
      <rect x="172" y="62" width="416" height="320" fill="#fbfdff" stroke="#9fb2c9" stroke-dasharray="4 3"/>
      <text class="tt" x="200" y="220" >绘图区（画布）</text>
      <text class="tt" x="200" y="238" >网格 / 坐标轴 / 引导线</text>
      <!-- right panel: properties -->
      <rect class="r" x="588" y="62" width="170" height="320"/>
      <text class="t" x="600" y="80">属性面板</text>
      <text class="tt" x="600" y="100">图层：</text>
      <text class="tt" x="600" y="118">颜色：</text>
      <text class="tt" x="600" y="136">线型：</text>
      <text class="tt" x="600" y="154">线宽：</text>
      <text class="tt" x="600" y="172">坐标 X/Y：</text>
      <!-- command line -->
      <rect class="r2" x="2" y="384" width="756" height="34"/>
      <text class="t" x="14" y="405">命令行：&gt; _  （输入命令 / 别名，Tab 补全，Ctrl+Shift+P 命令面板）</text>
      <!-- status bar -->
      <rect class="r" x="2" y="420" width="756" height="26"/>
      <text class="tt" x="14" y="438">状态栏：坐标 | 比例 | 捕捉 | 正交 | 主题：亮/暗</text>
    </svg>